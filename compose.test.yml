services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      MPVM_DATABASE_URL: postgresql://test:test@test-postgres:5432/mpvm_test
    volumes:
      - .:/workspace:ro
    depends_on:
      test-postgres:
        condition: service_healthy

  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mpvm_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d mpvm_test"]
      interval: 2s
      timeout: 5s
      retries: 30
